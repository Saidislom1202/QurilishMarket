<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin panel — Qurilish Mollari</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="topbar page-width about-topbar">
      <a class="brand" href="index.html"><img class="logo" src="logo.png" alt="Qurilish Mollari"><span>Qurilish<small>Mollari</small></span></a>
      <div class="seller-header-actions">
        <button class="button outline" id="adminLogoutBtn" type="button" hidden>Chiqish</button>
      </div>
    </div>
  </header>
  <main>
    <section class="section" id="loginView">
      <div class="page-width auth-page-wrap">
        <div class="auth-page-card">
          <p class="sale-label">ADMIN PANEL</p>
          <h2>Boshqaruv paneliga kirish</h2>
          <form id="adminLoginForm">
            <label><span>Login</span><input id="adminUsername" required></label>
            <label><span>Parol</span><input id="adminPassword" type="password" required></label>
            <p class="auth-error" id="adminLoginError" hidden></p>
            <button class="button primary" type="submit">Kirish</button>
          </form>
        </div>
      </div>
    </section>

    <section class="section seller-dash" id="adminPanelView" hidden>
      <div class="page-width">
        <div class="section-title"><div><h2>Umumiy statistika</h2><p>Platformadagi hozirgi holat</p></div></div>
        <div class="stats-grid" id="statsGrid"></div>

        <div class="dash-tabs">
          <button class="dash-tab active" data-status="pending" type="button">Kutilmoqda<em id="pendingBadge" hidden>0</em></button>
          <button class="dash-tab" data-status="approved" type="button">Tasdiqlangan</button>
          <button class="dash-tab" data-status="rejected" type="button">Rad etilgan</button>
        </div>
        <div id="sellersList"></div>
        <p class="empty" id="sellersEmpty" hidden>Bu bo'limda sotuvchilar yo'q.</p>
      </div>
    </section>
  </main>

  <dialog class="auth-dialog" id="actionDialog">
    <div class="auth-content">
      <button class="icon-button close-action" aria-label="Yopish">×</button>
      <p class="sale-label" id="actionTag">XABAR YUBORISH</p>
      <h2 id="actionTitle">Sotuvchiga xabar</h2>
      <p id="actionSubtitle">Xabar sotuvchining panelida ko'rinadi.</p>
      <form id="actionForm">
        <label><span>Xabar matni</span><textarea id="actionMessage" required rows="4" placeholder="Xabar matnini kiriting"></textarea></label>
        <label id="actionDurationField" hidden>
          <span>Bloklash muddati</span>
          <select id="actionDuration">
            <option value="">Butunlay (muddatsiz)</option>
            <option value="1">1 kunga</option>
            <option value="3">3 kunga</option>
            <option value="7">7 kunga</option>
            <option value="30">30 kunga</option>
          </select>
        </label>
        <p class="auth-error" id="actionError" hidden></p>
        <button class="button primary" type="submit" id="actionSubmit">Yuborish</button>
      </form>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
