name: iOS build check

# Faqat qo'lda ishga tushiriladi yoki ios/ papkalar o'zgarganda —
# macOS runner daqiqalari cheklangan bo'lgani uchun avtomatik har bir
# push'da ishlamaydi. Bu ilovani Simulator uchun quradi (haqiqiy
# qurilma/App Store uchun kerak bo'ladigan imzolash sertifikati talab
# qilinmaydi) — faqat kod xatosiz qurilishini tasdiqlash uchun.

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/ios/**'
      - 'mobile-seller/ios/**'
      - '.github/workflows/ios-build-check.yml'

jobs:
  build-buyer-app:
    name: Xaridor ilovasi (build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm install
        working-directory: mobile
        run: npm install
      - name: Sync web assets
        working-directory: mobile
        run: npx cap copy ios
      - name: Pod install
        working-directory: mobile/ios/App
        run: pod install
      - name: Build for Simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  build-seller-app:
    name: Sotuvchi ilovasi (build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm install
        working-directory: mobile-seller
        run: npm install
      - name: Prepare www (frontend'dan nusxa olish)
        working-directory: mobile-seller
        run: npm run prepare-www
      - name: Sync web assets
        working-directory: mobile-seller
        run: npx cap copy ios
      - name: Pod install
        working-directory: mobile-seller/ios/App
        run: pod install
      - name: Build for Simulator
        working-directory: mobile-seller/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
